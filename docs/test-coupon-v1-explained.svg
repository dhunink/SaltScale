<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
  </defs>

  <g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#111">
    <text x="40" y="30" font-size="18" font-weight="bold">Test Coupon v1 — Exploded &amp; Stack Views</text>

    <!-- Exploded side stack -->
    <g transform="translate(60,60)">
      <text x="0" y="0" font-size="16">Exploded stack (side view)</text>
      <!-- Upper platform (representative) -->
      <rect x="120" y="30" width="220" height="28" rx="4" fill="#dbeeff" stroke="#2b6fb2" />
      <text x="350" y="50">Upper platform (top plate boss)</text>

      <!-- arrow down -->
      <line x1="230" y1="58" x2="230" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Upper pad -->
      <rect x="140" y="110" width="180" height="20" rx="3" fill="#fff1c9" stroke="#c07a00" />
      <text x="350" y="125">Upper pad (removable)</text>

      <line x1="230" y1="130" x2="230" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Sensor placeholder -->
      <rect x="160" y="170" width="140" height="72" rx="3" fill="#e6ffea" stroke="#2e8b57" />
      <text x="320" y="205">Sensor (placeholder)</text>

      <line x1="230" y1="242" x2="230" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Lower pad -->
      <rect x="170" y="280" width="120" height="16" rx="2" fill="#ffecec" stroke="#b22222" />
      <text x="300" y="293">Lower pad (reaction)</text>

      <line x1="230" y1="296" x2="230" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Coupon base -->
      <rect x="60" y="340" width="360" height="120" rx="6" fill="#f7f7f7" stroke="#777" />
      <text x="430" y="395">Coupon base (module pocket integrated)</text>

      <!-- Overload stops (top at z=19 mm) drawn on side -->
      <rect x="420" y="170" width="12" height="60" fill="#ffd9e0" stroke="#cc4b5a" />
      <text x="440" y="205">Module overload stop (top @ z=19 mm)</text>
    </g>

    <!-- Top-down view of pocket with parts labeled -->
    <g transform="translate(640,60)">
      <text x="0" y="0" font-size="16">Top-down pocket view</text>
      <!-- coupon outline -->
      <rect x="20" y="30" width="360" height="360" rx="6" fill="#f7f7f7" stroke="#777" />

      <!-- sensor pocket area -->
      <rect x="140" y="110" width="120" height="120" fill="#e6ffea" stroke="#2e8b57" />
      <text x="270" y="170">Sensor pocket (38×38 mm)</text>

      <!-- upper pad footprint -->
      <rect x="155" y="125" width="90" height="90" fill="#fff1c9" stroke="#c07a00" />
      <text x="270" y="200">Upper pad footprint</text>

      <!-- lower pad footprint (same as sensor footprint) -->
      <rect x="140" y="110" width="120" height="120" fill-opacity="0" stroke="#b22222" stroke-dasharray="4 4" />
      <text x="270" y="230">Lower pad seating area</text>

      <!-- overload stops positions (4) -->
      <circle cx="260" cy="110" r="8" fill="#ffd9e0" stroke="#cc4b5a" />
      <circle cx="200" cy="110" r="8" fill="#ffd9e0" stroke="#cc4b5a" />
      <circle cx="200" cy="230" r="8" fill="#ffd9e0" stroke="#cc4b5a" />
      <circle cx="260" cy="230" r="8" fill="#ffd9e0" stroke="#cc4b5a" />
      <text x="270" y="120">Module stops (top @ z=19 mm)</text>

      <!-- dowel boss and hole -->
      <g>
        <circle cx="330" cy="300" r="18" fill="#ddddff" stroke="#444" />
        <circle cx="330" cy="300" r="6" fill="#ffffff" stroke="#444" />
        <text x="350" y="305">Dowel boss (4.2 mm hole)</text>
      </g>

      <!-- M3 blind pocket -->
      <rect x="60" y="300" width="12" height="12" fill="#cccccc" stroke="#444" />
      <text x="80" y="310">M3 blind pocket</text>
    </g>

    <!-- Legend -->
    <g transform="translate(60,520)" font-size="13">
      <rect x="0" y="0" width="16" height="12" fill="#e6ffea" stroke="#2e8b57" />
      <text x="24" y="10">Sensor placeholder / pocket</text>

      <rect x="0" y="20" width="16" height="12" fill="#fff1c9" stroke="#c07a00" />
      <text x="24" y="30">Upper pad</text>

      <rect x="0" y="40" width="16" height="12" fill="#ffecec" stroke="#b22222" />
      <text x="24" y="50">Lower pad</text>

      <rect x="0" y="60" width="16" height="12" fill="#ffd9e0" stroke="#cc4b5a" />
      <text x="24" y="70">Module overload stop</text>

      <rect x="0" y="80" width="16" height="12" fill="#ddddff" stroke="#444" />
      <text x="24" y="90">Dowel boss (hole center white)</text>
    </g>
  </g>
</svg>
