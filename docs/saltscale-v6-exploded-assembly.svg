<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="100%" height="100%" fill="#fff" />
  <g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#111">
    <!-- Exploded view panel -->
    <g transform="translate(50,50)">
      <text x="0" y="0" font-size="16" font-weight="bold">Exploded view (one quarter shown for clarity)</text>
      <!-- upper platform plate (segment top) -->
      <rect x="80" y="30" width="200" height="40" rx="6" fill="#e6f2ff" stroke="#2b6fb2" />
      <text x="90" y="55">Upper platform (segment)</text>

      <!-- arrows down to upper pad -->
      <line x1="180" y1="70" x2="180" y2="110" stroke="#333" stroke-width="2" marker-end="url(#arr)" />

      <!-- upper pad -->
      <rect x="120" y="110" width="160" height="20" rx="3" fill="#ffefdb" stroke="#c07a00" />
      <text x="130" y="125">Upper pad (removable)</text>

      <line x1="180" y1="130" x2="180" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arr)" />

      <!-- sensor placeholder -->
      <rect x="140" y="170" width="120" height="60" fill="#f2fff0" stroke="#2e8b57" />
      <text x="150" y="200">Sensor placeholder (or real sensor)</text>

      <line x1="180" y1="230" x2="180" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arr)" />

      <!-- lower pad -->
      <rect x="140" y="270" width="120" height="16" fill="#fff0f0" stroke="#b22222" />
      <text x="150" y="283">Lower pad</text>

      <line x1="180" y1="286" x2="180" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arr)" />

      <!-- module base integrated into segment lower plate -->
      <rect x="40" y="330" width="300" height="90" rx="6" fill="#f7f7f7" stroke="#666" />
      <text x="50" y="355">Module base (pocket, guide walls, stops) — part of segment lower plate</text>

      <!-- dowel and M3 callouts -->
      <circle cx="320" cy="360" r="6" fill="#999" stroke="#444" />
      <text x="330" y="365">Dowel hole (4.2 mm clearance)</text>
      <rect x="320" y="390" width="14" height="10" fill="#ccc" stroke="#444" />
      <text x="340" y="398">M3 blind pocket</text>

      <!-- legend -->
      <g transform="translate(0,440)">
        <rect x="0" y="0" width="12" height="12" fill="#e6f2ff" stroke="#2b6fb2" />
        <text x="20" y="10">Upper platform</text>
        <rect x="0" y="20" width="12" height="12" fill="#ffefdb" stroke="#c07a00" />
        <text x="20" y="30">Upper pad</text>
        <rect x="0" y="40" width="12" height="12" fill="#f2fff0" stroke="#2e8b57" />
        <text x="20" y="50">Sensor</text>
        <rect x="0" y="60" width="12" height="12" fill="#fff0f0" stroke="#b22222" />
        <text x="20" y="70">Lower pad</text>
        <rect x="0" y="80" width="12" height="12" fill="#f7f7f7" stroke="#666" />
        <text x="20" y="90">Module base / segment lower plate</text>
      </g>
    </g>

    <!-- cross-section panel -->
    <g transform="translate(420,50)">
      <text x="0" y="0" font-size="16" font-weight="bold">Cross-section through one sensor module (side view)</text>
      <!-- vertical stack illustration -->
      <rect x="140" y="30" width="40" height="20" fill="#e6f2ff" stroke="#2b6fb2" />
      <text x="190" y="45">Top plate boss</text>

      <rect x="140" y="55" width="40" height="16" fill="#ffefdb" stroke="#c07a00" />
      <text x="190" y="67">Upper pad (20..24 mm)</text>

      <rect x="140" y="71" width="40" height="100" fill="#f2fff0" stroke="#2e8b57" />
      <text x="190" y="120">Sensor (8..20 mm)</text>

      <rect x="140" y="171" width="40" height="16" fill="#fff0f0" stroke="#b22222" />
      <text x="190" y="184">Lower pad (6..8 mm)</text>

      <rect x="100" y="187" width="120" height="40" fill="#f7f7f7" stroke="#666" />
      <text x="190" y="215">Segment lower plate / ribs (0..6 mm)</text>

      <!-- module stops line -->
      <line x1="140" y1="95" x2="260" y2="95" stroke="#cc0000" stroke-dasharray="4 3" />
      <text x="270" y="98" fill="#cc0000">Module stop top (z = 19 mm)</text>
    </g>

    <!-- assembly order panel -->
    <g transform="translate(50,540)">
      <text x="0" y="0" font-size="16" font-weight="bold">Assembly order (recommended)</text>
      <text x="0" y="24">1. Populate each segment: insert sensor into pocket, seat on `lower_pad`, place `upper_pad`.</text>
      <text x="0" y="44">2. Join adjacent segments using dowels through reinforced bosses (align).</text>
      <text x="0" y="64">3. Repeat for remaining segments until full ring is aligned.</text>
      <text x="0" y="84">4. Tighten M3 screws in blind pockets at rim to clamp seams.</text>
    </g>

    <!-- markers -->
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
      </marker>
    </defs>
  </g>
</svg>
